name: Build and publish wheel

on:
  push:
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # amityping is pure Python -- one universal wheel (py3-none-any) covers
    # every supported interpreter, so it's built once here and installed
    # into each Python version below, rather than built per-version.
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  test:
    # Installs the exact wheel built above under each supported interpreter
    # and runs the suite against it -- proves the built artifact works on
    # 3.11/3.12/3.13, not just the source tree.
    name: Test wheel on Python ${{ matrix.python-version }}
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio

      - name: Run tests against installed wheel
        # Run outside the checkout's root so amitypes/ (the source directory)
        # can't shadow the installed wheel's copy on sys.path.
        run: |
          mkdir -p /tmp/test-run
          cd /tmp/test-run
          pytest "${GITHUB_WORKSPACE}/tests"

  publish:
    name: Publish to PyPI and create GitHub release
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/*
          generate_release_notes: true
